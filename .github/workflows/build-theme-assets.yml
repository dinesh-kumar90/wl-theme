name: Build theme assets

# Only runs when the React source actually changes, so editing Liquid/
# other theme files doesn't trigger a rebuild-and-commit cycle.
on:
  push:
    branches: [main]
    paths:
      - "react-src/**"

# Prevents overlapping runs from racing to commit.
concurrency:
  group: build-theme-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: react-src/package-lock.json

      - name: Install dependencies
        working-directory: react-src
        run: npm ci

      - name: Build
        working-directory: react-src
        run: npm run build

      # Note: GITHUB_TOKEN-authored commits do not retrigger push-based
      # workflows, so this will not loop.
      - name: Commit compiled assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/collection-showcase.js assets/collection-showcase.css
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "chore: rebuild collection-showcase assets [skip ci]"
            git push
          fi
